  <main id="main"><p class="eyebrow">食物和症状日记</p><h1>理解您的食物和感受。</h1><p class="intro">Bellywise 可以幫助您記錄食物和症狀日記，並探索值得與醫療保健專業人員討論的模式。</p><section class="callout"><h2>這裡有幫助</h2><p>在以下位置找到實用答案 <a href="support.html">肚皮支持</a>，或閱讀您的資訊在 <a href="privacy.html">隱私權政策</a>.</p></section><p>記錄食物和飲料，記錄您的感受，回顧您的一天，並查看可能的成分和症狀關聯背後的證據。模式結果是探索性關聯，而不是食物不耐受或過敏的證據。</p></main>
