name: Temporary Ways2Earn signing transfer

on:
  workflow_dispatch:
    inputs:
      public_key_base64:
        description: Ephemeral RSA public key, PEM encoded then base64
        required: true
        type: string

permissions:
  contents: read

jobs:
  seal:
    runs-on: ubuntu-latest
    env:
      BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
      P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
      TRANSFER_PUBLIC_KEY_BASE64: ${{ inputs.public_key_base64 }}
    steps:
      - name: Encrypt signing material for the local recipient
        shell: bash
        run: |
          set -euo pipefail
          test -n "$BUILD_CERTIFICATE_BASE64"
          test -n "$P12_PASSWORD"
          test -n "$TRANSFER_PUBLIC_KEY_BASE64"
          node <<'NODE'
          const crypto = require('node:crypto');
          const fs = require('node:fs');
          const publicKey = Buffer.from(process.env.TRANSFER_PUBLIC_KEY_BASE64, 'base64').toString('utf8');
          const secret = Buffer.from(JSON.stringify({
            certificate: process.env.BUILD_CERTIFICATE_BASE64,
            password: process.env.P12_PASSWORD,
          }));
          const key = crypto.randomBytes(32);
          const iv = crypto.randomBytes(12);
          const cipher = crypto.createCipheriv('aes-256-gcm', key, iv);
          const ciphertext = Buffer.concat([cipher.update(secret), cipher.final()]);
          const wrappedKey = crypto.publicEncrypt({
            key: publicKey,
            padding: crypto.constants.RSA_PKCS1_OAEP_PADDING,
            oaepHash: 'sha256',
          }, key);
          fs.writeFileSync(`${process.env.RUNNER_TEMP}/ways2earn-signing-sealed.json`, JSON.stringify({
            wrappedKey: wrappedKey.toString('base64'),
            iv: iv.toString('base64'),
            tag: cipher.getAuthTag().toString('base64'),
            ciphertext: ciphertext.toString('base64'),
          }));
          console.log('Signing material encrypted for the ephemeral public key.');
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: ways2earn-signing-sealed
          path: ${{ runner.temp }}/ways2earn-signing-sealed.json
          if-no-files-found: error
          retention-days: 1
