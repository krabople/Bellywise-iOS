name: Bellywise checks

on:
  push:
    paths:
      - 'foodprint/**'
      - 'scripts/ci/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'foodprint/**'
      - 'scripts/ci/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:
    inputs:
      capture_reuse_run:
        description: 'Optional run containing the immutable isolated capture simulator app'
        required: false
        type: string
        default: ''

permissions:
  contents: read
  actions: read

concurrency:
  group: bellywise-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: foodprint
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: foodprint/package-lock.json
      - run: npm ci
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Localisation completeness and interpolation safety
        run: npm run check:localization
      - name: Domain and parser tests
        run: npx tsx --test tests/*.test.ts
      - name: Capture bridge refuses stale or wrong-language renders
        run: python3 tests/test_capture_bridge.py
      - name: Web bundle
        run: npx expo export --platform web

  ios-compile:
    if: github.event_name != 'workflow_dispatch' || github.ref_name != 'codex/localised-screen-captures' || inputs.capture_reuse_run == ''
    needs: app-checks
    runs-on: macos-26
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: foodprint/package-lock.json
      - name: Install dependencies
        working-directory: foodprint
        run: npm ci
      - name: Select isolated screenshot entry point
        if: github.event_name == 'workflow_dispatch' && github.ref_name == 'codex/localised-screen-captures'
        working-directory: foodprint
        run: |
          node <<'NODE'
          const fs=require('fs');
          const p=require('./package.json');p.main='capture.tsx';fs.writeFileSync('package.json',JSON.stringify(p,null,2));
          const a=require('./app.json');const info=a.expo.ios.infoPlist;
          info.NSAppTransportSecurity={...(info.NSAppTransportSecurity??{}),NSAllowsLocalNetworking:true,NSExceptionDomains:{localhost:{NSExceptionAllowsInsecureHTTPLoads:true,NSIncludesSubdomains:false}}};
          fs.writeFileSync('app.json',JSON.stringify(a,null,2));
          NODE
      - name: Compile and launch iOS Simulator app
        run: bash scripts/ci/build-ios.sh
      - name: Capture French iPhone and iPad screens first
        if: github.event_name == 'workflow_dispatch' && github.ref_name == 'codex/localised-screen-captures'
        run: DEVELOPER_DIR="$(cat artifacts/xcode-developer-dir.txt)" python3 scripts/ci/capture-localized.py --locales fr --keep-devices
      - name: Keep French native captures for visual review
        if: always() && github.event_name == 'workflow_dispatch' && github.ref_name == 'codex/localised-screen-captures'
        uses: actions/upload-artifact@v7
        with:
          name: Bellywise-French-native-captures
          path: artifacts/localized-captures/fr
          if-no-files-found: warn
          retention-days: 7
      - name: Capture remaining listing languages
        if: github.event_name == 'workflow_dispatch' && github.ref_name == 'codex/localised-screen-captures'
        run: DEVELOPER_DIR="$(cat artifacts/xcode-developer-dir.txt)" python3 scripts/ci/capture-localized.py --exclude fr
      - name: Keep all translated native captures
        if: always() && github.event_name == 'workflow_dispatch' && github.ref_name == 'codex/localised-screen-captures'
        uses: actions/upload-artifact@v7
        with:
          name: Bellywise-all-localised-native-captures
          path: artifacts/localized-captures
          if-no-files-found: warn
          retention-days: 7
      - name: Keep native screenshots, logs and simulator artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Bellywise-ios-simulator
          path: |
            artifacts/*.log
            artifacts/*.png
            artifacts/*.ips
            artifacts/*.crash
            artifacts/simulator-devices.json
            artifacts/Bellywise-simulator.zip
          if-no-files-found: warn
          retention-days: 7
      - name: Keep capture diagnostics
        if: always() && github.event_name == 'workflow_dispatch' && github.ref_name == 'codex/localised-screen-captures'
        uses: actions/upload-artifact@v7
        with:
          name: Bellywise-capture-diagnostics
          path: artifacts/capture-session-*
          if-no-files-found: warn
          retention-days: 7

  capture-reuse:
    if: github.event_name == 'workflow_dispatch' && github.ref_name == 'codex/localised-screen-captures' && inputs.capture_reuse_run != ''
    needs: app-checks
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/download-artifact@v8
        with:
          name: Bellywise-ios-simulator
          run-id: ${{ inputs.capture_reuse_run }}
          github-token: ${{ github.token }}
          path: artifacts/reused-source
      - name: Verify immutable capture app and select Xcode
        env:
          CAPTURE_REUSE_RUN: ${{ inputs.capture_reuse_run }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/prepare-capture-reuse.py
      - name: Capture French screens with verified native startup
        run: python3 scripts/ci/capture-localized.py --locales fr --keep-devices
      - name: Keep French native captures for visual review
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Bellywise-French-native-captures
          path: artifacts/localized-captures/fr
          if-no-files-found: warn
          retention-days: 7
      - name: Capture remaining listing languages
        run: python3 scripts/ci/capture-localized.py --exclude fr
      - name: Keep all translated native captures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Bellywise-all-localised-native-captures
          path: artifacts/localized-captures
          if-no-files-found: warn
          retention-days: 7
      - name: Keep capture diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Bellywise-capture-diagnostics
          path: artifacts/capture-session-*
          if-no-files-found: warn
          retention-days: 7
